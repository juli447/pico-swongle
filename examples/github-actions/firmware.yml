name: Firmware
on:
  push:
    branches: [main]
    tags: ['switch1-v*', 'switch2-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host protocol tests
        run: sh tests/run_tests.sh
  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        personality: [switch1, switch2]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - name: Pico SDK
        run: |
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init lib/btstack lib/cyw43-driver lib/tinyusb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DPICO_SDK_PATH="$PWD/pico-sdk" -DSWONGLE_TARGET=${{ matrix.personality }}
          cmake --build build --parallel 4
          mkdir -p dist
          cp build/pico2w_switch_adapter.uf2 dist/pico-swongle-${{ matrix.personality }}.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-swongle-${{ matrix.personality }}
          path: dist/*.uf2
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish matching personality
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            switch1-v1.0.0) personality=switch1; prerelease= ;;
            switch2-v1.0.0-rc.1) personality=switch2; prerelease=--prerelease ;;
            *) echo "Add reviewed release notes and version configuration before publishing a new tag"; exit 1 ;;
          esac
          mkdir -p dist
          cp "artifacts/pico-swongle-$personality/pico-swongle-$personality.uf2" "dist/pico-swongle-$TAG.uf2"
          git archive --format=zip --prefix=pico-swongle/ HEAD > "dist/pico-swongle-$TAG-source.zip"
          (cd dist && sha256sum *.uf2 *.zip > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; keeping its verified assets."
          else
            gh release create "$TAG" dist/* --verify-tag --title "Pico Swongle $TAG" --notes-file "releases/$TAG.md" $prerelease
          fi
